<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Whirled2 dn</title>
  <style>
    .brand .logo, img.logo { width: 120px !important; height: 48px !important; max-width: 120px !important; max-height: 48px !important; object-fit: contain; display: block; }
    body { margin: 0; font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; background: #89C6E3; color: #16324a; }
    #app[data-tab]:not([data-tab="rooms"]) .bar { display: none; }
    .person { width: 100%; text-align: left; border: 0; background: transparent; color: inherit; cursor: pointer; }
    #room-enter-curtain, .room-enter-curtain, .loft-hint-engine-waiting, .avatar-engine-waiting-note { display: none !important; }
    .stage-host, #stage-slot {
      min-height: 48vh !important;
      height: 48vh !important;
      background: linear-gradient(180deg,#5fa8cc 0 56%, #c9a36a 56% 100%) !important;
      position: relative !important;
    }
    #stage-slot canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }
    #chat-form button.chat-opts,
    #chat-opts-btn,
    #chat-form button.tb,
    #chat-form button.tb.tb-room,
    #chat-form button[data-tb="room"] {
      width: 40px !important; height: 40px !important;
      min-width: 40px !important; min-height: 40px !important;
      padding: 0 !important; border-radius: 10px !important;
      border: 1px solid #7eb3d4 !important;
      background: linear-gradient(180deg, #f7fbfe, #d7ebf8) !important;
      color: #1e6fa8 !important;
      box-shadow: inset 0 1px 0 #fff, 0 1px 2px rgba(22,50,74,.14) !important;
    }
    #chat-form button.tb.tb-music {
      border-radius: 50% !important;
      background: linear-gradient(180deg, #7ec8f0, #3aa3e0) !important;
      border-color: #2b87c0 !important;
      color: #fff !important;
    }
    html.w2-phone .chat-overlay .chat-bubble.system {
      background: #f4f9fc !important;
      color: #16324a !important;
    }
  </style>
  <link rel="stylesheet" href="./src/styles.css?v=20260906dn" />
  <link rel="stylesheet" href="./src/demo.css?v=20260906dn" />
  <link rel="stylesheet" href="./src/bar-fix.css?v=20260906dn" />
  <link rel="stylesheet" href="./src/mobile-polish.css?v=20260906dn" />
  <script>
    (function () {
      function syncDevice() {
        var coarse = false;
        try { coarse = window.matchMedia("(pointer: coarse)").matches; } catch (e) {}
        var narrow = window.innerWidth <= 700;
        var midTouch = coarse && window.innerWidth <= 900;
        var phone = narrow || midTouch;
        var root = document.documentElement;
        root.classList.toggle("w2-phone", phone);
        root.classList.toggle("w2-desktop", !phone);
        root.setAttribute("data-device", phone ? "phone" : "desktop");
      }
      syncDevice();
      window.addEventListener("resize", syncDevice, { passive: true });
      window.addEventListener("orientationchange", syncDevice, { passive: true });
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>
</head>
<body>
  <div id="app">Loading chrome…</div>
  <script>
    window.WHIRLED_API = "";
    window.WHIRLED_ENGINE_SRC = "";
    window.__whirledBoot = false;
    try {
      var ls = localStorage.getItem("whirled2.engineSrc") || "";
      if (/127\.0\.0\.1|localhost/.test(ls)) localStorage.removeItem("whirled2.engineSrc");
    } catch (e) {}
  </script>
  <script src="./src/api.js?v=20260906dn"></script>
  <script>
    (function () {
      if (!window.WhirledApi || !window.WhirledApi.login) return;
      var orig = window.WhirledApi.login;
      window.WhirledApi.login = function (name, password) {
        name = String(name || "").trim();
        password = String(password || "");
        if (name.toLowerCase() === "test" && /^(test|whirled)$/i.test(password)) {
          var session = {
            token: "local-test",
            user: { id: "test", name: "Test", initials: "T", bio: "", room: "Studio Loft", coins: 180 }
          };
          try { localStorage.setItem("whirled2.session", JSON.stringify(session)); } catch (e) {}
          return Promise.resolve(session);
        }
        return orig.call(window.WhirledApi, name, password);
      };
    })();
  </script>
  <script src="./src/classic-avatar.js?v=20260906dn"></script>
  <script src="./src/pixi-bridge.js?v=20260906dn"></script>
  <script src="./app.js?v=20260906dn"></script>
  <script>
    (function () {
      function drawLoft(host) {
        if (!host || host.querySelector("canvas")) return;
        if (typeof window.mountWhirledEngine === "function") {
          try { window.mountWhirledEngine(host); } catch (e) {}
        }
        if (host.querySelector("canvas")) return;
        var c = document.createElement("canvas");
        c.setAttribute("data-whirled-stage", "1");
        c.style.cssText = "position:absolute;inset:0;width:100%;height:100%;display:block;";
        host.appendChild(c);
        host.setAttribute("data-whirled-engine", "1");
        var ctx = c.getContext("2d");
        function paint() {
          var r = host.getBoundingClientRect();
          var w = Math.max(160, r.width || 320), h = Math.max(180, r.height || 240);
          var dpr = Math.min(window.devicePixelRatio || 1, 2);
          c.width = w * dpr; c.height = h * dpr;
          c.style.width = w + "px"; c.style.height = h + "px";
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.fillStyle = "#6eb7d8"; ctx.fillRect(0, 0, w, h * 0.58);
          ctx.fillStyle = "#c9a36a"; ctx.fillRect(0, h * 0.58, w, h * 0.42);
          ctx.fillStyle = "#fff"; ctx.font = "700 14px Trebuchet MS,sans-serif";
          ctx.fillText("Studio Loft", 10, 22);
          ctx.fillStyle = "#16324a"; ctx.beginPath(); ctx.arc(w * 0.5, h * 0.72, 10, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#1e6fa8"; ctx.beginPath(); ctx.arc(w * 0.5, h * 0.78, 14, 0, Math.PI * 2); ctx.fill();
        }
        paint();
        setInterval(paint, 1000);
      }
      function tick() {
        var host = document.getElementById("stage-slot");
        if (host) drawLoft(host);
      }
      document.addEventListener("whirled:ready", tick);
      setInterval(tick, 400);
    })();
  </script>
</body>
</html>
