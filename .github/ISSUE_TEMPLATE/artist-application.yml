name: Artist application
description: Apply for volunteer or paid art work on Whirled 2.
title: "[artist] "
labels: ["artist", "whirled2"]
body:
  - type: markdown
    attributes:
      value: |
        Read [ARTISTS.md](https://github.com/whirledclassic/whirled2/blob/main/whirled2/ARTISTS.md) first.
        Paid spots exist. Volunteer spots exist. Pick one.
        No original Whirled shop items.
  - type: input
    id: handle
    attributes:
      label: Name / handle
    validations:
      required: true
  - type: input
    id: email
    attributes:
      label: Email
      description: Josh uses this to reply. It will be visible on this issue.
    validations:
      required: true
  - type: input
    id: portfolio
    attributes:
      label: Portfolio link
      placeholder: https://
    validations:
      required: true
  - type: dropdown
    id: roles
    attributes:
      label: Roles
      multiple: true
      options:
        - Avatar
        - Room / environment
        - Furniture / props
        - UI / chrome
        - Shop / items
        - Animator
        - Music / SFX
        - Other
    validations:
      required: true
  - type: dropdown
    id: track
    attributes:
      label: Track
      options:
        - Volunteer (credit, no invoice)
        - Paid spot (I will quote a rate)
        - Open to either
    validations:
      required: true
  - type: input
    id: rate
    attributes:
      label: Rate for the first drop (if paid or open to either)
      description: Example — $80 for one walk cycle, or $40 per prop.
      placeholder: $
  - type: dropdown
    id: pay_shape
    attributes:
      label: How do you want to get paid?
      options:
        - Volunteer / not applicable
        - One-time payment for this drop only
        - Long-term — I get that it is still one-time payments per batch for now
        - Would discuss a retainer later if the project can carry it
    validations:
      required: true
  - type: textarea
    id: first_drop
    attributes:
      label: First drop you would actually make
      description: One room, one walk cycle, 4 props — not a whole catalog.
    validations:
      required: true
  - type: dropdown
    id: license
    attributes:
      label: License if we ship it
      options:
        - Repo license is fine
        - CC-BY
        - CC-BY-SA
        - Written grant, ask me first
        - Not sure yet
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Terms
      options:
        - label: I understand paid vs volunteer, applying is not a hire, and long-term paid work is still one-time payments per asset drop unless we agree otherwise in writing.
          required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Tools, hours you can spare, Discord handle.
