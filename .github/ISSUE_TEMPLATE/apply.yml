name: Apply to Whirled 2
description: Art, code, or Discord. Paid opportunity if accepted.
title: "[apply] "
labels: ["whirled2"]
body:
  - type: markdown
    attributes:
      value: |
        Read [ARTISTS.md](https://github.com/whirledclassic/whirled2/blob/main/whirled2/ARTISTS.md).
        Paid work happens if you are accepted and the first job is a fit.
        Links to previous work are required.
  - type: input
    id: handle
    attributes:
      label: Name / handle
    validations:
      required: true
  - type: input
    id: email
    attributes:
      label: Email
    validations:
      required: true
  - type: input
    id: discord
    attributes:
      label: Discord handle
    validations:
      required: true
  - type: input
    id: portfolio
    attributes:
      label: Main link to previous work
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: more_links
    attributes:
      label: More links
      description: GitHub, ArtStation, itch, clips, a Discord you already run. One URL per line.
  - type: dropdown
    id: roles
    attributes:
      label: Roles
      multiple: true
      options:
        - Discord mod / community manager
        - PixiJS / TypeScript engine
        - Website chrome
        - Server / networking / deploy
        - Classic msoy lab
        - Avatar art
        - Room / environment art
        - Furniture / props
        - UI / chrome art
        - Shop / item art
        - Animation
        - Music / SFX
        - Other
    validations:
      required: true
  - type: dropdown
    id: track
    attributes:
      label: Pay
      options:
        - I want to be paid
        - Paid preferred
        - Volunteer / credit
    validations:
      required: true
  - type: input
    id: rate
    attributes:
      label: Rate for the first job
      placeholder: $
  - type: dropdown
    id: pay_shape
    attributes:
      label: One job or ongoing?
      options:
        - One-time payment for this first job
        - Ongoing — still one payment per drop for now
        - Would talk retainer later
        - Volunteer / not applicable
  - type: textarea
    id: first_drop
    attributes:
      label: What would you actually do first?
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Got it
      options:
        - label: I sent real links. Paid work happens if I am accepted and the first job is a fit.
          required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
