name: Apply
description: Classic Flash revival or Whirled 2. Art, code, Discord.
title: "[apply] "
labels: ["whirled2"]
body:
  - type: markdown
    attributes:
      value: |
        Two projects: Classic Whirled (Flash revival) and Whirled 2 (PixiJS + TypeScript).
        Paid work if you are accepted and the first job is a fit. Links required.
  - type: input
    id: handle
    attributes:
      label: Name / handle
    validations:
      required: true
  - type: input
    id: email
    attributes:
      label: Email
    validations:
      required: true
  - type: input
    id: discord
    attributes:
      label: Discord handle
    validations:
      required: true
  - type: dropdown
    id: projects
    attributes:
      label: Which project?
      multiple: true
      options:
        - Classic Whirled (original Flash revival)
        - Whirled 2 (PixiJS + TypeScript)
        - Both
    validations:
      required: true
  - type: input
    id: portfolio
    attributes:
      label: Main link to previous work
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: more_links
    attributes:
      label: More links
  - type: dropdown
    id: roles
    attributes:
      label: Roles
      multiple: true
      options:
        - Discord — build / set up the server
        - Discord — moderate it
        - Discord — advertise it and get people in
        - Discord — keep people engaged and posted during development
        - Whirled 2 — PixiJS / TypeScript engine
        - Whirled 2 — website chrome
        - Whirled 2 — server / networking / deploy
        - Classic — Flash revival / msoy lab
        - Avatar art
        - Room / environment art
        - Furniture / props
        - UI / chrome art
        - Shop / item art
        - Animation
        - Music / SFX
        - Other
    validations:
      required: true
  - type: dropdown
    id: track
    attributes:
      label: Pay
      options:
        - I want to be paid
        - Paid preferred
        - Volunteer / credit
    validations:
      required: true
  - type: input
    id: rate
    attributes:
      label: Rate for the first job
  - type: textarea
    id: first_drop
    attributes:
      label: What would you actually do first?
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Got it
      options:
        - label: I sent real links. I picked a project. Paid work happens if I am accepted and the first job is a fit.
          required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
